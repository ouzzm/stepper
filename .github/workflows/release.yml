name: Release

# Pushing a tag like v1.2.3 builds the extension and publishes a GitHub release with the zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check that the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./src/manifest.json').version")
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest $manifest / package.json $pkg"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run package

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "release/stepper-$version.zip" \
            --title "Stepper $version" \
            --generate-notes
