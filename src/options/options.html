<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stepper settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Stepper</h1>

      <section aria-labelledby="hosts-title">
        <h2 id="hosts-title">Azure DevOps address</h2>
        <p class="hint">Stepper runs only on the addresses you allow here. Reload open Azure DevOps tabs after adding one.</p>
        <form id="host-form" class="row">
          <input id="host-input" type="text" placeholder="https://azure.example.com" autocomplete="off" required />
          <button type="submit">Allow</button>
        </form>
        <p id="host-message" class="message" role="status"></p>
        <ul id="host-list" class="host-list"></ul>
      </section>

      <section aria-labelledby="steps-title">
        <h2 id="steps-title">Steps</h2>
        <p class="hint">
          Steps run top to bottom. A question asks yes or no; only the steps under the chosen answer appear on the ticket.
        </p>
        <div id="editor" aria-busy="true"><p class="hint">Loading…</p></div>
        <div class="row actions">
          <button id="save" type="button" class="primary" disabled>Save</button>
          <button id="discard" type="button" disabled>Discard changes</button>
          <span id="save-message" class="message" role="status"></span>
        </div>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
